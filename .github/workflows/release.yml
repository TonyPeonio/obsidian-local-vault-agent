name: Release

# Builds the plugin from source on a version tag (e.g. `0.1.1`), attests the provenance
# of the artifacts, and publishes a GitHub release with the three files Obsidian installs.
# The Obsidian community directory rebuilds the plugin from the lockfile and compares it
# with the release asset, so releases must come from here, not from a local build.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      # Betas for BRAT testers, e.g. 0.9.0-beta.1: published as a pre-release from manifest-beta.json,
      # so manifest.json on main (what the community store reads) keeps the stable version.
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the manifest
        run: |
          case "${GITHUB_REF_NAME}" in
            *-beta.*)
              # A beta ships manifest-beta.json as its manifest.json.
              version=$(node -p "require('./manifest-beta.json').version")
              if [ "$version" != "${GITHUB_REF_NAME}" ]; then
                echo "manifest-beta.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
                exit 1
              fi
              # The community store reads manifest.json on main: it must never carry a beta version.
              stable=$(node -p "require('./manifest.json').version")
              case "$stable" in
                *-*)
                  echo "manifest.json carries a pre-release version ($stable); the community store reads it. Only manifest-beta.json may hold a beta version." >&2
                  exit 1
                  ;;
              esac
              cp manifest-beta.json manifest.json
              echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
              ;;
            *)
              version=$(node -p "require('./manifest.json').version")
              if [ "$version" != "${GITHUB_REF_NAME}" ]; then
                echo "manifest.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
                exit 1
              fi
              echo "PRERELEASE=" >> "$GITHUB_ENV"
              ;;
          esac

      - run: npm test

      - run: npm run build

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes" $PRERELEASE
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME}" --generate-notes $PRERELEASE
          fi
