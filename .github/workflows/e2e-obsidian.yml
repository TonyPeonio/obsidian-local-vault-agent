name: E2E in Obsidian

# Drives the built plugin inside a real Obsidian (wdio-obsidian-service) under a virtual display.
# Separate from CI and Release on purpose: it downloads Obsidian and opens a window, so a hiccup
# here must never block a release. Run on pushes that touch the plugin, and on demand.

on:
  push:
    branches: [main, "e2e/**"]
    paths: ["src/**", "styles.css", "manifest.json", "e2e-obsidian/**", ".github/workflows/e2e-obsidian.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the test runner
        working-directory: e2e-obsidian
        run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: e2e-obsidian/.obsidian-cache
          key: obsidian-cache-${{ runner.os }}
      - name: Run the tests in Obsidian
        working-directory: e2e-obsidian
        shell: bash
        # The verdict comes from the per-spec steps below, so the log is always complete.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx wdio run ./wdio.conf.mts 2>&1 | tee wdio.log || true
      # One step per spec, so the result of each is visible on the run page without opening the log.
      # A spec counts only if the report marks it as passed: a run that found no specs fails all nine.
      - name: "Spec: loads and exposes its API"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ loads and exposes its API" wdio.log
      - name: "Spec: chat, diff, approve"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ chat → diff → approve changes the note" wdio.log
      - name: "Spec: reject"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ rejecting a diff leaves the note alone" wdio.log
      - name: "Spec: undo"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ undo shows the reverse diff and restores the note" wdio.log
      - name: "Spec: change history"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ the change history lists the change and its undo" wdio.log
      - name: "Spec: report a problem"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ report a problem shows a redacted report and sends nothing" wdio.log
      - name: "Spec: setup checklist"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ the setup checklist shows the four steps with live status" wdio.log
      - name: "Spec: sample notes"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ try it on sample notes creates the notes and offers three questions" wdio.log
      - name: "Spec: settings page"
        if: always()
        working-directory: e2e-obsidian
        run: grep -F "✓ the settings page renders, with the provider and the report button" wdio.log
      - name: No spec failed
        if: always()
        working-directory: e2e-obsidian
        run: |
          grep -E "passing|failing" wdio.log || true
          # What failed, as annotations on the run (readable without opening the log).
          grep -E "✖|Error:|Expected|Received|expected|timeout|not (created|shown|changed)" wdio.log | sed -E 's/\x1b\[[0-9;]*m//g' | head -9 | while IFS= read -r line; do echo "::error::${line}"; done
          ! grep -Eq "[0-9]+ failing" wdio.log
